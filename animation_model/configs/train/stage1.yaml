exp_name: 'stage1'
output_dir: './redo'
seed: 42
resume_from_checkpoint: ''

checkpointing_steps: 2000
save_model_epoch_interval: 1

data:
  train_bs: 2
  video_dirs: ['/scratch/cs/faceedit/mengting/data/CelebV-HQ/videos'] # Your data root folder
  render_dirs: ['/scratch/cs/faceedit/mengting/data/CelebV-HQ/render_videos']
  guids: 
    - 'render'
  image_size: 512
  bbox_crop: true
  aug_type: "Resize"
  sample_margin: 40

validation:
  validation_steps: 1000
  ref_images:
    - validation_data/ref_images/frame_0000.jpg
  guidance_folders:
    - validation_data/guid_sequences/0
  guidance_indexes: [45]


solver:
  gradient_accumulation_steps: 1
  mixed_precision: 'fp16'
  enable_xformers_memory_efficient_attention: False
  gradient_checkpointing: False
  max_train_steps: 1000000  # 50000
  max_grad_norm: 1.0
  # lr
  learning_rate: 1.0e-5
  scale_lr: False 
  lr_warmup_steps: 1
  lr_scheduler: 'constant'

  # optimizer
  use_8bit_adam: False 
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay:  1.0e-2
  adam_epsilon: 1.0e-8

noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start:          0.00085
  beta_end:            0.012
  beta_schedule:       "scaled_linear"
  steps_offset:        1
  clip_sample:         false

guidance_encoder_kwargs:
  guidance_embedding_channels: 320
  guidance_input_channels: 3
  block_out_channels: [16, 32, 96, 256]

base_model_path: '/scratch/cs/faceedit/mengting/diffusion_models/stable-diffusion-v1-5'
vae_model_path: '/scratch/cs/faceedit/mengting/diffusion_models/sd-vae-ft-mse' # 有没有可能是vae的问题？

weight_dtype: 'fp16'  # [fp16, fp32]
uncond_ratio: 0.1   # 不使用dropout
noise_offset: 0.05
snr_gamma: 5.0
enable_zero_snr: True 
 
